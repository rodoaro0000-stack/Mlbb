<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Legends — Le dernier Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2c46b;--red:#e0454f;--ink:#e9edf7;--dim:#8b93a7;--disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#03040a;color:var(--ink);font-family:Newsreader,Georgia,serif;overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0b1226,#05070f 55%,#020307)}
#fx{position:absolute;inset:0;width:100%;height:100%}
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--gold);z-index:9;transition:width 1s}
/* Nexus */
#nexus{position:absolute;left:50%;top:50%;width:min(60vw,320px);aspect-ratio:100/140;transform:translate(-50%,-52%);opacity:0;transition:opacity 2.5s,transform 3s;pointer-events:none;--a:#6fd0ff;--b:#2f86d6;--c:#17519b;--d:#0b2c63;--g:rgba(92,200,255,.38)}
#nexus .glow{position:absolute;inset:-70%;background:radial-gradient(circle,var(--g),transparent 60%);animation:br 5s ease-in-out infinite}
#nexus svg{position:relative;width:100%;height:100%;overflow:visible;animation:fl 7s ease-in-out infinite}
.f{transform-box:fill-box;transform-origin:center;transition:transform 1.8s cubic-bezier(.1,.7,.3,1),opacity 1.8s,fill 3s}
.f1{fill:var(--a)}.f2{fill:var(--b)}.f3{fill:var(--c)}.f4{fill:var(--d)}
#nexus.calm{opacity:.4}
#nexus.flicker{animation:fk 3.2s infinite}
#nexus.rise{opacity:.62}#nexus.rise .glow{inset:-110%}
#nexus.pulse{opacity:.58}#nexus.pulse .glow{animation-duration:1.1s}
#nexus.dim{opacity:.1}
#nexus.ember{opacity:.5;transform:translate(-50%,-52%) scale(.55);--a:#ffe2a0;--b:#e8a840;--c:#8f5c16;--d:#3b2408;--g:rgba(242,196,107,.32)}
#nexus.shatter{opacity:.6;transition:opacity 2.5s 1.2s}
#nexus.shatter.gone{opacity:0}
#nexus.shatter .glow{display:none}
#nexus.shatter svg{animation:none}
#nexus.shatter .f1{transform:translate(-40px,-70px) rotate(-30deg);opacity:0}
#nexus.shatter .f2{transform:translate(50px,-50px) rotate(25deg);opacity:0}
#nexus.shatter .f3{transform:translate(-45px,80px) rotate(35deg);opacity:0}
#nexus.shatter .f4{transform:translate(55px,90px) rotate(-20deg);opacity:0}
.shard{position:absolute;left:50%;top:40%;width:9px;height:14px;background:#6fd0ff;clip-path:polygon(50% 0,100% 100%,0 80%)}
@keyframes br{50%{transform:scale(1.15);opacity:.7}}
@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes fk{0%,100%{opacity:.42}8%{opacity:.1}12%{opacity:.42}40%{opacity:.3}44%{opacity:.08}50%{opacity:.4}}
/* Texte */
#txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8vh 7vw;text-align:center}
.blk{max-width:30em;transition:opacity .7s}
.blk.out{opacity:0}
.ln{font-size:clamp(1.1rem,4.6vw,1.65rem);line-height:1.55;margin:.15em 0;opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s;text-shadow:0 2px 18px #000,0 0 6px #000}
.ln.in{opacity:1;transform:none}
.ln.em{font-family:var(--disp);font-weight:600;font-size:clamp(1.8rem,8vw,3.2rem);line-height:1.15;color:var(--gold);margin:.3em 0;letter-spacing:.01em}
/* Cartes */
#card{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:6vw;opacity:0;pointer-events:none;transition:opacity 1s}
#card.on{opacity:1}
#card .tl{font-size:clamp(1rem,4vw,1.3rem);color:var(--gold);font-style:italic}
#card h2{font-family:var(--disp);font-weight:700;font-size:clamp(2.4rem,11vw,5rem);line-height:1;margin-top:.2em}
#card.notif{justify-content:flex-start;padding-top:9vh}
.nt{display:flex;gap:14px;text-align:left;max-width:26em;background:rgba(20,26,44,.96);border:1px solid #2b3552;border-radius:16px;padding:16px;transform:translateY(-30px);transition:transform .8s}
.on .nt{transform:none}
.nt i{flex:none;width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#6fd0ff,#17519b);display:grid;place-items:center;font:700 1.3rem var(--disp);font-style:normal}
.nt b{font-size:.95rem}.nt p{font-size:1rem;line-height:1.45;color:#cdd4e6;margin-top:4px}
#card.defeat{background:rgba(58,62,72,.9)}
#card.defeat h1{font-family:var(--disp);font-size:clamp(3rem,16vw,7rem);color:#aab0bd;letter-spacing:.04em}
#card.victory{background:radial-gradient(circle,rgba(242,196,107,.45),rgba(3,4,10,.9) 70%)}
#card.victory h1{font-family:var(--disp);font-size:clamp(3rem,16vw,7rem);color:var(--gold);text-shadow:0 0 40px rgba(242,196,107,.8)}
#card.error{background:rgba(3,4,10,.75)}
.er{border:1px solid var(--red);background:#1a0b0e;padding:20px 24px;border-radius:12px;max-width:24em}
.er b{color:var(--red);font-family:var(--disp);font-size:1.4rem}.er p{margin-top:6px;font-size:1.15rem}
.logo{font-family:var(--disp);font-weight:700;font-size:clamp(2.2rem,11vw,4.6rem);color:var(--gold);letter-spacing:.06em}
#card.logo p{color:var(--dim);font-style:italic}
#card.end{pointer-events:auto;background:rgba(2,3,7,.6)}
#card.end p{color:var(--dim);margin-bottom:18px}
button{font:inherit;color:var(--ink);background:none;border:1px solid #3a4565;border-radius:99px;padding:.6em 1.4em;cursor:pointer}
/* Horloge */
#clk{position:fixed;left:50%;transform:translateX(-50%);font-family:var(--disp);font-weight:600;color:var(--ink);opacity:0;z-index:6;transition:all 1.5s;letter-spacing:.08em}
#clk.big{top:68%;font-size:3.4rem;opacity:1}
#clk.small{top:calc(3vh + env(safe-area-inset-top,0px));font-size:1.2rem;opacity:.8}
#clk.red{color:var(--red)}
/* HUD + départ */
#hud{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:8;opacity:.4}
#hud button{padding:.35em .9em;font-size:.85rem}
#start{position:fixed;inset:0;z-index:20;background:#03040a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:8vw}
#start h1{font-family:var(--disp);font-size:clamp(2.6rem,12vw,5rem);line-height:1}
#start p{color:var(--dim);font-style:italic}
#go{color:var(--gold);border-color:var(--gold);font-size:1.1rem;margin-top:10px}
@media(prefers-reduced-motion:reduce){#nexus svg,#nexus .glow,#nexus.flicker{animation:none}}
</style></head><body>
<div id="stage"><canvas id="fx"></canvas>
<div id="nexus"><div class="glow"></div><svg viewBox="0 0 100 140"><polygon class="f f1" points="50,4 12,50 50,64"/><polygon class="f f2" points="50,4 88,50 50,64"/><polygon class="f f3" points="12,50 50,136 50,64"/><polygon class="f f4" points="88,50 50,136 50,64"/></svg></div>
<div id="txt"></div></div>
<div id="card"></div><div id="clk"></div><div id="prog"></div>
<div id="hud"><button id="bp">Pause</button><button id="bs">Passer</button><button id="bv">×1</button><button id="bm">Son</button></div>
<div id="start"><h1>Le dernier Nexus</h1><p>Mobile Legends — monologue cinématique<br>Active le son avant de commencer.</p><button id="go">Commencer</button></div>
<audio id="au" src="music.mp3" preload="auto" loop></audio>
<script>
const ACTS=[{"nexus":"hidden","blocks":[{"c":"ping"},{"l":["Et si…"]},{"l":["Et si un jour, tu ouvrais Mobile Legends pour la dernière fois ?"]},{"l":["Pas pour atteindre Mythique.","Pas pour pousser jusqu'à Mythical Glory.","Pas pour obtenir ce skin collector que tu attends depuis des mois."]},{"l":["Non."]},{"l":["Juste pour jouer.","Une dernière fois."]},{"l":["Tu lances le jeu. Le logo de Moonton apparaît. La musique démarre. Ton héros préféré se tient devant toi."]},{"l":["Tout semble normal."]},{"l":["Puis une notification apparaît."]},{"c":"notif","a":"Chers joueurs, après de nombreuses années à vos côtés, nous vous annonçons la fermeture définitive des serveurs de Mobile Legends: Bang Bang."},{"l":["Tu relis le message.","Une fois.","Deux fois.","Trois fois."]},{"l":["Et tu ris."]},{"l":["Parce que non. Pas MLBB.","Pas ce jeu-là.","Pas celui qui t'a accompagné pendant toutes ces années."]},{"l":["Tu fermes la notification.","Tu regardes ton écran.","Et tu te dis :"]},{"l":["*« Bon… une dernière ranked, alors. »"]}]},{"label":"Acte I","title":"Nous étions des joueurs","nexus":"calm","music":["play",0.45,8],"blocks":[{"l":["Tu te souviens de tes débuts ?"]},{"l":["Quand tu ne connaissais même pas la différence entre une voie EXP et une voie Gold.","Quand tu choisissais Miya parce qu'elle avait l'air cool.","Quand tu pensais que tuer cinq ennemis suffisait pour gagner une partie."]},{"l":["Tu ne connaissais ni les rotations, ni les compositions, ni les contres.","Tu ne savais pas ce qu'était le snowball.","Tu ne connaissais pas les timings du Turtle.","Tu ne savais même pas pourquoi tout le monde écrivait « GG » à la fin d'une partie perdue."]},{"l":["Mais tu jouais.","Tu apprenais.","Tu perdais.","Et tu revenais."]},{"l":["Puis, petit à petit, tu as compris."]},{"l":["Tu as appris à regarder la carte.","À reconnaître les ennemis.","À protéger ton tireur.","À abandonner un combat impossible pour sauver une tourelle."]},{"l":["Tu as découvert que derrière chaque héros se cachait une stratégie.","Et derrière chaque défaite…","Une leçon que tu n'avais pas toujours envie d'apprendre."]},{"l":["Parce que MLBB, ce n'était pas seulement un jeu où cinq joueurs affrontaient cinq autres joueurs."]},{"l":["C'était un endroit où tu pouvais passer de débutant à vétéran.","Où chaque rang représentait un objectif.","Où chaque étoile gagnée te donnait l'impression d'avoir progressé.","Et où chaque étoile perdue te faisait parfois remettre toute ta vie en question."]},{"l":["Et puis, il y a les ranked."]},{"l":["Ces fameuses ranked."]}]},{"label":"Acte II","title":"Les trahisons du champ de bataille","nexus":"flicker","music":["lvl",0.8,10],"blocks":[{"l":["Parlons-en, des ranked."]},{"l":["Ces parties où tu arrives avec de bonnes intentions.","Tu te dis : « Aujourd'hui, je monte. Aujourd'hui, je joue sérieusement. »"]},{"l":["Et là…"]},{"l":["Un joueur choisit un héros que personne n'a demandé.","Un autre refuse de changer de voie.","Un troisième écrit « I carry » avant même le début de la partie."]},{"l":["Et cinq minutes plus tard…"]},{"l":["*« An ally has been slain. »"]},{"l":["Encore.","Et encore."]},{"l":["Tu regardes la carte.","Tu regardes ton équipe.","Tu regardes le ciel.","Et tu te demandes ce que tu as fait pour mériter ça."]},{"l":["Tu joues tank ?","Personne ne suit ton engagement."]},{"l":["Tu joues tireur ?","Personne ne te protège."]},{"l":["Tu joues mage ?","Tes adversaires semblent avoir un abonnement premium à ta position."]},{"l":["Tu prends un objectif ?","Ton équipe poursuit un ennemi à l'autre bout de la carte."]},{"l":["Et pourtant…","Tu relances."]},{"l":["Parce que tu crois en cette prochaine partie.","Cette partie où, peut-être, tout fonctionnera.","Cette partie où ton jungler comprendra qu'un Turtle existe."]},{"l":["Cette partie où ton équipe découvrira que les tourelles ne se détruisent pas toutes seules.","Cette partie où quelqu'un écrira enfin :"]},{"l":["*« Well played, team. »"]},{"l":["Mais au fond, les pires défaites ne sont pas celles où tu joues mal."]},{"l":["Ce sont celles où tu donnes tout.","Celles où tu défends jusqu'au bout.","Celles où tu réussis un engagement parfait…","Et où personne n'est là pour en profiter."]},{"l":["Tu regardes ton Nexus perdre ses derniers points de vie.","L'écran devient gris."]},{"c":"defeat"},{"l":["Et tu restes là.","Sans parler."]},{"l":["Parce que tu sais que tu aurais pu gagner.","Et c'est précisément pour ça que tu relances."]}]},{"label":"Acte III","title":"Les héros qui nous ont fait grandir","nexus":"calm","music":["lvl",0.4,5],"blocks":[{"l":["Mais si MLBB disparaissait demain…","Quels seraient les héros dont on se souviendrait ?"]},{"l":["Il y aurait les assassins.","Ceux qui apparaissent de nulle part, éliminent leur cible et disparaissent avant même que tu comprennes ce qui s'est passé."]},{"l":["Il y aurait les tireurs.","Fragiles au début, terrifiants à la fin.","Ces héros qui te font souffrir pendant dix minutes…","Avant de transformer le dernier combat en véritable cauchemar pour l'équipe adverse."]},{"l":["Il y aurait les mages.","Les combattants.","Les junglers."]},{"l":["Et puis…","Il y aurait les tanks."]},{"l":["Ces héros dont le travail est parfois si ingrat que personne ne remarque leur présence…","Jusqu'au jour où ils ne sont plus là."]},{"l":["Parce qu'il faut quelqu'un pour ouvrir le combat.","Quelqu'un pour encaisser.","Quelqu'un pour protéger ceux qui ne peuvent pas se protéger eux-mêmes."]},{"l":["Et parmi eux, il y aurait Belerick."]},{"l":["Oui, Belerick."]},{"l":["Pas nécessairement le héros le plus spectaculaire.","Pas toujours celui qui vole la vedette dans les vidéos."]},{"l":["Mais celui qui peut tenir debout au milieu du chaos, encaisser les attaques et donner à son équipe une chance de continuer à se battre."]},{"l":["Et quelque part, c'est une belle métaphore."]},{"l":["Parce que dans MLBB, tout le monde veut être le héros qui fait le pentakill.","Tout le monde veut être celui dont le nom apparaît dans les moments forts."]},{"l":["Mais une victoire ne se construit pas uniquement avec des joueurs qui veulent briller.","Elle se construit aussi avec ceux qui acceptent de faire le travail invisible."]},{"l":["Ceux qui protègent.","Ceux qui engagent.","Ceux qui reviennent défendre la base alors que tout semble perdu."]},{"l":["Parce que parfois, le joueur le plus important n'est pas celui qui tue le dernier ennemi.","C'est celui qui permet à son équipe de survivre assez longtemps pour gagner."]},{"l":["Et si tu as déjà joué tank, tu sais exactement de quoi je parle."]}]},{"label":"Acte IV","title":"Mythique, et après ?","nexus":"rise","music":["lvl",0.85,12],"blocks":[{"l":["On a tous poursuivi quelque chose dans ce jeu."]},{"l":["Une étoile.","Un rang.","Un taux de victoire."]},{"l":["Un titre.","Un classement mondial."]},{"l":["On s'est parfois énervés pour une seule défaite.","On a parfois oublié qu'on jouait pour nous amuser."]},{"l":["On a sacrifié des soirées à enchaîner les parties, convaincus que la prochaine victoire nous rapprocherait de notre objectif."]},{"l":["Et quand on atteignait enfin Mythique…","On ressentait cette satisfaction.","Ce sentiment d'avoir franchi une étape."]},{"l":["Puis on regardait le rang suivant.","Encore un objectif.","Encore une montée.","Encore une raison de continuer."]},{"l":["Et si, un jour, tout cela s'arrêtait ?"]},{"l":["Si tous les rangs disparaissaient ?","Si les statistiques étaient effacées ?","Si personne ne pouvait plus consulter ton profil pour voir tes performances ?"]},{"l":["Qui serais-tu, sans ton rang ?","Qui serais-tu, sans tes étoiles ?","Qui serais-tu, si plus personne ne pouvait voir que tu avais atteint Mythique ?"]},{"c":"silence","a":3000},{"l":["Tu serais toujours la personne qui a appris à persévérer.","Celle qui a recommencé après une défaite.","Celle qui a appris à réfléchir sous pression.","Celle qui a découvert que même un joueur exceptionnel ne peut pas contrôler les quatre autres personnes de son équipe."]},{"l":["Et peut-être que c'est ça, la vraie progression."]},{"l":["Pas le rang affiché sous ton pseudo.","Mais tout ce que tu as appris en essayant de l'atteindre."]}]},{"label":"Acte V","title":"La dernière partie","nexus":"pulse","music":["lvl",0.6,6],"titleClock":"23:58","blocks":[{"l":["Il ne reste que deux minutes."]},{"l":["Les serveurs vont fermer."]},{"l":["Tu te connectes.","Pour la dernière fois, tu entres dans le lobby."]},{"l":["Tu regardes tes amis.","Certains sont en ligne.","D'autres ne reviendront jamais."]},{"l":["Tu envoies une invitation.","Un joueur rejoint le groupe.","Puis un deuxième.","Puis un troisième."]},{"l":["Vous ne parlez presque pas.","Parce que vous savez."]},{"l":["Vous savez que cette fois, ce n'est pas une saison qui se termine.","Ce n'est pas un événement qui disparaît.","Ce n'est pas une maintenance qui va durer quelques heures."]},{"l":["C'est la fin."]},{"l":["Vous choisissez vos héros.","Et quand vient ton tour…","Tu prends celui avec lequel tu as vécu tes meilleures parties."]},{"c":"clock","a":"23:59"},{"l":["Peu importe la méta.","Peu importe le taux de victoire.","Peu importe si quelqu'un dans l'équipe pense que ton choix n'est pas optimal."]},{"l":["Ce soir, tu ne joues pas pour le classement.","Tu joues pour les souvenirs."]},{"l":["*« Welcome to Mobile Legends. »"]},{"l":["Cette voix.","Cette phrase que tu as entendue des milliers de fois.","Et pourtant, ce soir, elle te fait quelque chose."]},{"l":["La partie commence."]},{"l":["Vous avancez dans les voies.","Vous éliminez vos premiers ennemis.","Vous prenez une tourelle."]},{"l":["Vous perdez un combat.","Vous vous regroupez."]},{"l":["Comme avant.","Exactement comme avant."]},{"l":["Et pendant quelques minutes…","Tu oublies que c'est la dernière fois."]},{"l":["Tu redeviens simplement un joueur.","Un joueur parmi des millions d'autres.","Un joueur qui veut gagner avec ses amis."]},{"l":["Puis le dernier combat commence."]},{"l":["Les cinq adversaires sont devant vous.","Ton cœur accélère.","Tu regardes la carte.","Tu sais ce que tu dois faire."]},{"l":["Tu avances.","Tu engages.","Ton équipe te suit."]},{"l":["Les compétences explosent à l'écran.","Un ennemi tombe.","Puis un deuxième.","Un troisième."]},{"l":["Le dernier combat est terminé."]},{"c":"victory"},{"l":["Vos personnages célèbrent la victoire.","Vous avez gagné.","Vous avez vraiment gagné."]},{"l":["Mais personne ne crie.","Personne ne parle de la prochaine ranked."]},{"l":["Parce que vous savez qu'il n'y en aura pas."]},{"l":["Tu regardes le Nexus ennemi qui vient de s'effondrer.","Et tu te surprends à sourire."]},{"l":["Pas parce que tu as gagné.","Mais parce que tu as pu jouer cette dernière partie avec eux."]}]},{"label":"Acte VI","title":"00 h 00","nexus":"shatter","music":["cut"],"clock":"00:00","blocks":[{"l":["Un message apparaît."]},{"c":"error","a":"La connexion au serveur a été interrompue."},{"l":["Tu retournes au menu.","Tu essaies de te reconnecter.","Échec."]},{"l":["Tu recommences.","Échec."]},{"l":["Tu fermes le jeu.","Tu le relances.","Échec."]},{"l":["Et là…","Tu comprends."]},{"l":["Il n'y aura plus de prochaine partie.","Plus de nouvelle saison.","Plus de nouveaux héros à découvrir."]},{"l":["Plus de mises à jour à attendre.","Plus de débats sur le héros le plus fort du patch."]},{"l":["Plus de joueurs qui affirment que leur héros est injouable alors qu'ils viennent de perdre leur cinquième partie consécutive."]},{"l":["Plus de « Need backup ! »","Plus de « Launch attack ! »","Plus de « Well played ! »"]},{"l":["Le silence."]},{"l":["Et dans ce silence, tu réalises quelque chose."]},{"l":["Tu as passé des centaines, peut-être des milliers d'heures dans ce jeu.","Tu as connu des victoires qui t'ont rendu heureux.","Des défaites qui t'ont mis en colère."]},{"l":["Des rencontres qui t'ont marqué.","Des moments tellement ordinaires que tu n'avais jamais pensé à les apprécier."]},{"l":["Tu croyais que le jeu serait toujours là.","Que tu pourrais toujours y retourner.","Que même après une longue pause, tu pourrais ouvrir l'application et retrouver ton monde."]},{"l":["Mais aucun jeu ne promet de rester éternellement.","Et aucune communauté ne reste exactement la même."]},{"l":["Les joueurs grandissent.","Les priorités changent.","Les amis se séparent.","Les générations se succèdent."]},{"l":["Un jour, tu ne seras peut-être plus le joueur que tu es aujourd'hui.","Et ce n'est pas forcément triste."]},{"l":["C'est la vie."]},{"l":["Mais ça n'empêche pas de regretter les choses qui nous ont accompagnés pendant une partie de notre existence."]}]},{"label":"Final","title":"Merci, Mobile Legends","nexus":"ember","music":["restart",0.85,12],"blocks":[{"l":["Alors, si un jour Mobile Legends ferme définitivement ses portes…"]},{"l":["Je ne veux pas qu'on se souvienne uniquement de ses skins les plus rares.","Ni de ses joueurs les plus célèbres.","Ni des équipes qui ont remporté les plus grands tournois."]},{"l":["Je veux qu'on se souvienne du joueur débutant qui a découvert son premier héros.","De celui qui jouait après les cours.","De ces amis qui se retrouvaient chaque soir pour une partie.","Du joueur tank que personne ne remerciait."]},{"l":["Du tireur qui attendait désespérément qu'on le protège.","Du jungler qui tentait un dernier vol de Lord.","Du joueur qui avait perdu cinq parties, mais qui continuait d'espérer."]},{"l":["Je veux qu'on se souvienne de tous ceux qui n'ont jamais été champions du monde.","De tous ceux dont le nom n'apparaîtra jamais dans les livres d'histoire de l'e-sport."]},{"l":["Parce qu'ils étaient, eux aussi, Mobile Legends.","Ils étaient la communauté.","Ils étaient les parties ordinaires."]},{"l":["Ils étaient les victoires sans spectateurs.","Ils étaient les défaites dont personne ne parlera."]},{"l":["Ils étaient ces millions de petites histoires qui, mises ensemble, ont fait vivre un monde immense."]},{"l":["Et si les serveurs s'éteignent un jour…","Le monde conti const $=s=>document.querySelector(s),S={paused:false,skip:false,speed:1},au=$('#au'),nx=$('#nexus'),clk=$('#clk');
const nb=t=>t.replace(/« /g,'«\u00a0').replace(/ »/g,'\u00a0»').replace(/ ([!?:;])/g,'\u00a0$1');
const wait=ms=>new Promise(r=>{let left=ms,last=performance.now();(function f(){const n=performance.now(),d=n-last;last=n;if(!S.paused)left-=d*S.speed;if(left<=0||S.skip)return r();setTimeout(f,40)})()});
/* Musique : volume animé, boucle avec fondu aux extrémités */
const M={on:false,cur:0,tg:0,k:.05,out:false};
setInterval(()=>{if(!M.on)return;M.cur+=(M.tg-M.cur)*M.k;const t=au.currentTime,d=au.duration||999,f=Math.max(0,Math.min(1,t/3,(d-t)/4));au.volume=Math.max(0,Math.min(1,M.cur*f));if(M.out&&M.cur<.01){au.pause();M.on=false}},50);
function mus(c,l,s){M.k=s?1-Math.exp(-.15/s):.05;
 if(c==='cut'){M.on=false;M.cur=0;au.volume=0;au.pause();return}
 if(c==='out'){M.tg=0;M.out=true;return}
 if(c==='play'||c==='restart'){if(c==='restart'||!M.on){au.currentTime=0;M.cur=0}M.out=false;M.on=true;M.tg=l;au.play().catch(()=>{});return}

(function draw(t){requestAnimationFrame(draw);if(t-lt<40)return;lt=t;cx.clearRect(0,0,W,H);for(const p of P){p.y-=p.v*40*ps;if(p.y<-.02)p.y=1.02;cx.fillStyle='rgba('+pc+','+p.a+')';cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,6.3);cx.fill()}})(0);

function nex(s){curNx=s;nx.querySelectorAll('.shard').forEach(e=>e.remove());nx.className=s==='hidden'?'':s;
